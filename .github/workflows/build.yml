name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The APK is only compiled here as a check: a CI runner signs with a throwaway debug key,
      # which would block updating an installed copy. Ship the APK from a local build instead.
      - run: ./gradlew :shared:desktopTest :androidApp:assembleDebug :desktopApp:packageDeb :desktopApp:createDistributable
      - run: tar -czf Eichhorn-linux-x86_64.tar.gz -C desktopApp/build/compose/binaries/main/app Eichhorn
      - run: cd browser-extension && zip -r ../eichhorn-browser-extension.zip . -x '*.DS_Store'
      - uses: actions/upload-artifact@v4
        with:
          name: eichhorn-linux-deb
          path: desktopApp/build/compose/binaries/main/deb/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: eichhorn-linux-tar
          path: Eichhorn-linux-x86_64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: eichhorn-browser-extension
          path: eichhorn-browser-extension.zip
